name: RefCard01 CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/m347-ref-card-01

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Build image
        run: docker build -t $IMAGE:latest .

      - name: Test image
        run: |
          docker run -d --name app -p 8080:8080 $IMAGE:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080 > /dev/null && docker rm -f app && exit 0
            sleep 2
          done
          docker logs app
          exit 1

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag $IMAGE:latest $IMAGE:${{ github.run_number }}
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.run_number }}
